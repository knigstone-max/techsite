# Pages CMS config (https://pagescms.org) - free admin for this repo.
# Log in at https://app.pagescms.org with the GitHub account that owns the repo (knigstone-max).
# Every save is a commit to main, which redeploys the site through .github/workflows/pages.yml.
# Category values must match the slugs in site.json. Images are stored in static/img/posts and written as img/posts/...

media:
  input: static/img/posts
  output: img/posts
  rename: safe
  extensions: [webp, png, jpg, jpeg]

settings:
  content:
    merge: true          # keep any frontmatter keys not listed below
  commit:
    identity: user       # commits show who saved (owner or invited writer)
    templates:
      create: "CMS: new post {path} ({userName})"
      update: "CMS: edit {path} ({userName})"
      delete: "CMS: delete {path} ({userName})"
      rename: "CMS: rename {oldPath} -> {newPath} ({userName})"

content:
  - name: posts_he
    label: כתבות בעברית
    type: collection
    path: content/he
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    subfolders: false
    view:
      fields: [title, date, category, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    # same field list is reused for English below (YAML anchor)
    fields: &post_fields
      - name: title
        label: כותרת / Title
        type: string
        required: true
      - name: slug
        label: כתובת (slug) - אותיות לועזיות קטנות, ספרות ומקפים, זהה בעברית ובאנגלית
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "רק a-z, 0-9 ומקף (-)"
      - name: date
        label: תאריך / Date
        type: date
        required: true
      - name: category
        label: קטגוריה / Category
        type: select
        required: true
        options:
          values:
            - { value: smartphones-gadgets, label: "סמארטפונים וגאדג'טים / Smartphones & Gadgets" }
            - { value: home-appliances, label: "מוצרי חשמל לבית / Home Appliances" }
            - { value: tech-news, label: "חדשות טכנולוגיה / Tech News" }
            - { value: reviews, label: "ביקורות / Reviews" }
            - { value: gaming-lite, label: "גיימינג לייט / Gaming Lite" }
      - name: excerpt
        label: תקציר / Excerpt
        type: text
        required: true
      - name: image
        label: תמונה ראשית / Hero image (ריק = איור הקטגוריה)
        type: image
      - name: image_alt
        label: תיאור התמונה (חובה אם יש תמונה) / Image alt text
        type: string
      - name: image_credit
        label: קרדיט תמונה (חובה אם יש תמונה) / Image credit
        type: string
      - name: image_credit_url
        label: קישור לקרדיט / Credit URL
        type: string
      - name: image_position
        label: מיקום חיתוך התמונה (לא חובה, למשל center 30%) / Image position
        type: string
      - name: source_links
        label: מקורות (קישור בכל שורה; בביקורות להשאיר ריק) / Sources
        type: string
        list: true
      - name: draft
        label: טיוטה - לא יופיע באתר / Draft (hidden)
        type: boolean
        default: false
      - name: body
        label: "תוכן הכתבה (Markdown). ## כותרת משנה, - רשימה, ![תיאור](img/posts/file.webp \"כיתוב\") לתמונה"
        type: code
        options:
          format: markdown
  - name: posts_en
    label: English posts
    type: collection
    path: content/en
    format: yaml-frontmatter
    filename: "{fields.slug}.md"
    subfolders: false
    view:
      fields: [title, date, category, draft]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields: *post_fields
